name: Publish Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'google-apps-script/**'
      - 'tools/apps-script/**'
      - 'server/apps-script.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Alleen gepubliceerde versie vergelijken met actuele main (geen writes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record tested source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check script and publication safety
        # MCP-auth tests also import the existing Supabase/MFA verifier.
        # Install repository dependencies before running those offline tests.
        # No environment credentials are supplied to this step.
        run: npm ci --no-audit --no-fund
      - name: Run script and publication checks
        run: |
          node tools/apps-script/check-syntax.mjs
          node --test tools/apps-script/check-syntax.test.mjs tools/apps-script/diagnostics.test.mjs
          node server/apps-script.test.js
          node server/account-profiles.test.js
          node shared/artist-catalogue.test.js
          node server/artist-show.test.js
          node server/artist-preparation.test.js
          node --test server/artist-biographies.test.js
          node shared/account-employment.test.js
          node server/mojo-timetable.test.js
          node server/show-timetables.test.js
          node server/ontrack.test.js
          node server/ontrack-concerts.test.js
          node --test server/ontrack-report/*.test.js
          node server/online-report-mail.test.js
          node server/email-engagement.test.js
          node --test tools/apps-script/deploy.test.mjs
          node server/mcp.test.js
          node server/showprofile-risks.test.js
          node server/operational-risks.test.js
          node server/show-measures.test.js
          node server/measure-implementation.test.js
          node server/production-assessments.test.js
          node server/show-open.test.js
          node server/shows-store.test.js
          node server/home-dashboard.test.js
          node server/web-report-catalogue.test.js
          node server/historical-reports.test.js
          node server/web-report-timetables.test.js
          node shared/report-catalogue.test.js
          node shared/report-filename.test.js
          node server/report-source.test.js
          node src/lib/report-catalogue-cache.test.js
          node shared/home-planning.test.js
          node src/lib/home-cache.test.js
      - name: Install pinned publication tool
        run: npm ci --prefix tools/apps-script --no-audit --no-fund
      - name: Require tested main still current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "Main is gewijzigd tijdens de tests. Herstart deze workflow voor de actuele main."
            exit 1
          fi
      - name: Update existing webapp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          APPS_SCRIPT_VERIFY_ONLY: ${{ inputs.verify_only == true && 'true' || 'false' }}
        run: node tools/apps-script/deploy.mjs

