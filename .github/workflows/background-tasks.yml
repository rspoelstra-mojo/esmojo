name: Continue approved background tasks
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['server/redis-native/views.js', 'server/background-tasks/registry.js', 'api/background-tasks-sync.js', '.github/workflows/background-tasks.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: continue
        options: [continue, status, reports-check, reports-resume, redis-resume]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ (inputs.operation == 'status' || inputs.operation == 'reports-check') && 'background-tasks-status-production' || 'approved-background-tasks-production' }}
  cancel-in-progress: false
jobs:
  continue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Wait for the fixed recovery worker
        if: github.event_name == 'push' || inputs.operation == 'redis-resume'
        run: |
          node --input-type=module <<'JS'
          let ready=false;for(let n=0;n<30;n++){try{const result=await fetch('https://esmojo.nl/api/background-tasks-sync',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(result.headers.get('x-esmojo-background-worker')==='2'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,10000));}if(!ready)throw Error('BACKGROUND_RECOVERY_NOT_READY');
          JS
      - name: Continue existing approved tasks only
        env:
          BACKGROUND_TASK_OPERATION: ${{ github.event_name == 'push' && 'redis-resume' || inputs.operation || 'continue' }}
        run: node tools/background/continue.mjs
