name: Check application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      artistredis:
        image: redis:7.2.7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare isolated Redis test client
        run: |
          cat > "$RUNNER_TEMP/esmojo-redis-cli" <<'EOF'
          #!/bin/sh
          exec docker exec "$ESMOJO_TEST_REDIS_CONTAINER" redis-cli "$@"
          EOF
          chmod +x "$RUNNER_TEMP/esmojo-redis-cli"
      - name: Authentication, authorization and existing server tests
        env:
          ESMOJO_TEST_REDIS_CLI: ${{ runner.temp }}/esmojo-redis-cli
          ESMOJO_TEST_REDIS_CONTAINER: ${{ job.services.artistredis.id }}
          ESMOJO_TEST_REDIS_PORT: '6379'
        run: |
          node server/accounts-api.test.js
          node server/account-modules.test.js
          node server/home-dashboard.test.js
          node server/web-report-catalogue.test.js
          node server/historical-reports.test.js
          node --test tools/reports/web-import-workflow.test.mjs
          node server/web-report-timetables.test.js
          node shared/report-catalogue.test.js
          node shared/report-filename.test.js
          node server/report-source.test.js
          node src/lib/report-catalogue-cache.test.js
          node shared/home-planning.test.js
          node src/lib/home-cache.test.js
          node src/lib/show-direct-route.test.js
          node server/report-web.test.js
          node src/lib/report-view.test.js
          node shared/report-security.test.js
          node shared/report-medical.test.js
          node src/lib/report-menu.test.js
          node --test src/lib/report-direct-route.test.js
          node server/email-template.test.js
          node server/email-tests.test.js
          node server/email-deliverability.test.js
          node server/ontrack.test.js
          node server/ontrack-concerts.test.js
          node --test server/ontrack-report/*.test.js
          node server/online-report-mail.test.js
          node server/email-engagement.test.js
          node src/lib/mail-open-receipt.test.js
          node src/lib/report-alerts.test.js
          node server/auth-submission.test.js
          node server/session-cookie.test.js
          node server/account-profiles.test.js
          node shared/artist-catalogue.test.js
          node shared/artist-names.test.js
          node server/artist-service.test.js
          node server/artist-show.test.js
          node server/artist-preparation.test.js
          node --test server/incident-metrics.test.js
          node --test server/artist-biographies.test.js
          node --test src/artist-profile.test.js
          node server/artist-views.test.js
          node src/lib/artist-catalogue-cache.test.js
          node --test src/lib/artist-show-memory.test.js
          node shared/account-employment.test.js
          node server/drive-write-diagnostic.test.js
          node server/apps-script.test.js
          node server/mojo-timetable.test.js
          node server/show-timetables.test.js
          node server/google-drive.test.js
          node tools/apps-script/check-syntax.mjs
          node --test tools/apps-script/check-syntax.test.mjs tools/apps-script/diagnostics.test.mjs
          node tools/apps-script/deploy.test.mjs
          node --test server/analysis-finalization.test.js server/ticket-data.test.js src/lib/research-view.test.js src/lib/show-photo-cache.test.js server/mojo-photo.test.js server/mojo-agenda.test.js server/github-identity.test.js server/shows-store.test.js server/shows-api.test.js
          node server/showprofile-pdf.test.js
          node server/showprofile-download.test.js
          node server/mfa-security.test.js
          node server/security-hardening.test.js
          node server/authorization-matrix.test.js
          node src/lib/barrier-reference-cache.test.js
          node tools/security/browser-headers.mjs
          node src/lib/mfa-verification.test.js
          node --test src/lib/show-menu-cache.test.js server/startup-view.test.js src/lib/router.test.js src/lib/profile-saves.test.js
          node tools/pdf/verify-original.mjs
          node --test server/report-original/tests/*.test.ts
          node server/research.test.js
          node tools/research/client.test.mjs
          node server/mcp.test.js
          node server/showprofile-risks.test.js
          node server/operational-risks.test.js
          node server/show-measures.test.js
          node server/measure-implementation.test.js
          node server/production-assessments.test.js
          node shared/report-timeline.test.js
          node src/lib/background-saves.test.js
          node src/lib/save-retry.test.js
          node server/show-storage-sync.test.js
          node server/active-show-storage.test.js
          node server/active-show-lifecycle.test.js
          node server/active-show-parity.test.js
          node server/active-show-recovery.test.js
          node server/active-show-handoff.test.js
          node tools/storage/generate-validators.mjs --check
          node src/lib/show-storage-alerts.test.js
          node src/lib/show-save-response.test.js
          node server/show-open-load.test.js
          node server/show-open.test.js
          node server/show-page.test.js
          node src/lib/show-memory.test.js
          node src/lib/show-planning.test.js
          node --test src/lib/production-choice-saves.test.js
          node server/fluid-preview.test.js
          node server/fluid-preview-source.test.js
          node server/fluid-interactions.test.js
          node server/mobile-navigation.test.js
          node server/risk-analysis-page.test.js
          node .agents/skills/esmojo-concertonderzoek/scripts/workflow.test.mjs
      - name: Incidentregistratie en revisiebewaking in Chrome
        run: node tools/ui/check-incident-registration.mjs
      - name: Email previews zonder verzending
        run: node tools/email/check-preview.mjs /tmp/esmojo-email-preview
      - name: Bewaar fictieve emailvoorbeelden
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esmojo-email-preview
          path: /tmp/esmojo-email-preview
          retention-days: 7
      - name: Controleer openbare productie-logo na livegang
        if: github.ref == 'refs/heads/main'
        run: node tools/email/check-live-logo.mjs

