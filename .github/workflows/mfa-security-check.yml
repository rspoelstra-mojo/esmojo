name: Check native MFA replay protection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/redis-native/**'
      - 'server/mfa-api.js'
      - '.github/workflows/mfa-security-check.yml'
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify native storage without an Auth challenge or account
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/mfa';let ready=false;
          for(let n=0;n<24;n++){try{const r=await fetch(endpoint,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.ok&&r.headers.get('x-esmojo-security-storage')==='1'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,10000));}if(!ready)throw Error('SECURITY_DEPLOYMENT_NOT_READY');
          let confirmed=false;for(let n=0;n<3;n++){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
            const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify({operation:'native-health'}),signal:AbortSignal.timeout(60000)});const data=await response.json();
            console.log(JSON.stringify({ok:data.ok===true,dataverseReady:data.dataverseReady===true,enabled:data.enabled===true,elapsedMs:Number.isSafeInteger(data.elapsedMs)?data.elapsedMs:null}));
            if(response.ok&&data.ok&&data.dataverseReady&&data.secretKeyReady){confirmed=true;break;}await new Promise(resolve=>setTimeout(resolve,10000));
          }if(!confirmed)throw Error('NATIVE_SECURITY_UNCONFIRMED');
          JS
