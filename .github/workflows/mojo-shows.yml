name: Import concert catalogue, staff planning, Showbeheer and upcoming timetables
on:
  schedule:
    - cron: '0 3,4 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Alleen de agenda lezen en centrale catalogus controleren, niets opslaan
        type: boolean
        default: true
      run_now:
        description: Nu de volledige agenda-import draaien (ook buiten 05:00); vereist dat verify_only uit staat
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/mojo-shows.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: mojo-shows-production
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify current catalogue; import at five and check upcoming timetables
        env:
          VERIFY_ONLY: ${{ github.event_name == 'push' || inputs.verify_only == true }}
          RUN_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.run_now == true }}
        run: |
          node --input-type=module <<'JS'
          const hour=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hourCycle:'h23'}).format(new Date()),verify=process.env.VERIFY_ONLY==='true',manual=!verify&&process.env.RUN_NOW==='true';
          if(!verify&&!manual&&hour!=='05'){console.log('Geen Nederlandse importrun.');process.exit(0);}
          const endpoint='https://esmojo.nl/api/shows-sync';
          {let ready=false;for(let n=0;n<24;n++){try{const r=await fetch(endpoint,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.status===405&&r.headers.get('x-esmojo-agenda-import')==='3'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,10000));}if(!ready)throw Error('AGENDA_DEPLOYMENT_NOT_READY');}
          async function call(body){const identityUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);identityUrl.searchParams.set('audience',endpoint);const identity=await fetch(identityUrl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(310000)});const result=await response.json();if(!response.ok){const code=/^[A-Z_0-9]{1,60}$/.test(result.code||'')?result.code:'CONCERT_IMPORT_UNCONFIRMED',stage=/^[a-z-]{1,30}$/.test(result.stage||'')?result.stage:'unknown';console.log(JSON.stringify({code,stage,...Number.isInteger(result.status)?{status:result.status}:{},.../^[A-Za-z]{1,30}$/.test(result.kind||'')?{kind:result.kind}:{},.../^[A-Z][A-Z0-9_]{2,59}$/.test(result.detail||'')?{detail:result.detail}:{},.../^[a-z-]{1,40}$/.test(result.venue||'')?{venue:result.venue}:{}}));throw Error('CONCERT_IMPORT_UNCONFIRMED');}return result;}
          const extra=manual?{manualRun:true}:{};
          let result=await call(verify?{verifyOnly:true}:extra);console.log(JSON.stringify(result));
          const started=Date.now(),inBudget=()=>Date.now()-started<35*60*1000;
          // 1. Concerten: vervolgbatches zolang de agenda niet volledig is verwerkt.
          for(let batch=0;!verify&&result.concertsPending&&batch<100&&inBudget();batch++){result=await call({...extra,operation:'continue'});console.log(JSON.stringify(result));}
          if(result.concertsPending)throw Error('CONCERT_IMPORT_INCOMPLETE');
          // 2. Personeelsplanning: concerten van de komende 365 dagen voor de tien vaste zalen, per zaal in batches met een cursor.
          // Een fout blokkeert de overige stappen niet, maar laat de run wel falen.
          let staff={staffPending:!verify,staffCursor:null},staffFailed=0,staffFailure=null;
          try{for(let batch=0;!verify&&staff.staffPending&&batch<10&&inBudget();batch++){staff=await call({...extra,operation:'staffplanning',...staff.staffCursor?{staffAfter:staff.staffCursor}:{}});staffFailed+=staff.staffPlanning?.failed||0;console.log(JSON.stringify(staff));}}catch(error){staffFailure=error;}
          // 3. Showbeheer voor Gashouder-shows die in het showmenu staan (komende 45 dagen) wordt automatisch aangemaakt (create-only).
          // Een fout blokkeert de overige stappen niet, maar laat de run wel falen.
          let management={managementPending:!verify,managementCursor:null},managementFailed=0,managementFailure=null;
          try{for(let batch=0;!verify&&management.managementPending&&batch<20&&inBudget();batch++){management=await call({...extra,operation:'showbeheer',...management.managementCursor?{managementAfter:management.managementCursor}:{}});managementFailed+=management.management?.failed||0;console.log(JSON.stringify(management));}}catch(error){managementFailure=error;}
          // 4. Dagelijkse controle van het MOJO-tijdschema voor de komende 45 dagen; de meest recente versie wint. Een fout hier
          // blokkeert de fotostap niet, maar laat de run wel falen.
          let timetables={timetablesPending:!verify,timetablesCursor:null},timetableFailure=null;
          try{for(let batch=0;!verify&&timetables.timetablesPending&&batch<20&&inBudget();batch++){timetables=await call({...extra,operation:'timetables',...timetables.timetablesCursor?{timetablesAfter:timetables.timetablesCursor}:{}});console.log(JSON.stringify(timetables));}}catch(error){timetableFailure=error;}
          // 5. Artiestfoto's worden in batches met een cursor ingehaald; de backlog mag over meerdere dagen lopen en laat de run niet falen.
          for(let batch=0;!verify&&result.photosPending&&batch<100&&inBudget();batch++){result=await call({...extra,operation:'photos',...result.photosCursor?{photoAfter:result.photosCursor}:{}});console.log(JSON.stringify(result));}
          if(!verify&&staff.staffPending)console.log('Personeelsplanning wordt bij de volgende import voortgezet.');
          if(!verify&&management.managementPending)console.log('Showbeheer-aanmaak wordt bij de volgende import voortgezet.');
          if(!verify&&timetables.timetablesPending)console.log('Tijdschemacontrole wordt bij de volgende import voortgezet.');
          if(result.photosPending)console.log('Artiestfoto’s worden bij de volgende import voortgezet.');
          if(staffFailure)throw staffFailure;
          if(staffFailed)throw Error('PERSONEELSPLANNING_INCOMPLETE');
          if(managementFailure)throw managementFailure;
          if(managementFailed)throw Error('SHOWBEHEER_INCOMPLETE');
          if(timetableFailure)throw timetableFailure;
          JS
  references:
    # Tweede deel van de dagrun van 05:00: dagelijkse incidentreferenties en voorbereiding van artiestopeningen.
    # Draait ook als de import deels faalde, maar nooit bij alleen controleren (verify_only) of een push.
    needs: import
    if: ${{ !cancelled() && github.event_name != 'push' && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Update daily incident references and prepare artist openings
        env:
          RUN_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.run_now == true }}
        run: |
          node --input-type=module <<'JS'
          const hour=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hourCycle:'h23'}).format(new Date());
          if(process.env.RUN_NOW!=='true'&&hour!=='05'){console.log('Geen Nederlandse dagrun.');process.exit(0);}
          const target='https://esmojo.nl/api/incident-references-sync';
          async function call(body){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',target);
            const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);
            const response=await fetch(target,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(310000)});const result=await response.json();
            if(!response.ok||result?.ok!==true){console.log(JSON.stringify({code:/^[A-Z][A-Z0-9_]{2,59}$/.test(result?.code||'')?result.code:'UNCONFIRMED',stage:result?.stage||null}));throw Error('DAILY_WORKER_UNCONFIRMED');}
            return result;
          }
          let ready=false;for(let attempt=0;attempt<12;attempt++){try{if((await call({incidentRefresh:true,checkOnly:true})).workerVersion===3){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,20000));}if(!ready)throw Error('INCIDENT_WORKER_NOT_READY');
          let complete=false;for(let round=0;round<600;round++){const result=await call({incidentRefresh:true});if(result.workerVersion!==3||typeof result.pending!=='boolean'||!['processing','complete','no_eligible_reports'].includes(result.status))throw Error('INCIDENT_WORKER_UNCONFIRMED');if(!result.pending){if(result.status!=='complete')throw Error('INCIDENT_REFERENCES_NO_ELIGIBLE_REPORTS');complete=true;break;}}
          if(!complete)throw Error('INCIDENT_REFERENCES_INCOMPLETE');console.log('Incidentreferenties bijgewerkt.');
          // Voorbereiding van artiestopeningen is onderhoud; voortgang blijft bewaard en wordt bij de volgende run voortgezet.
          let prepared=await call({artistPerformance:'inventory'});for(let round=0;round<1000&&!prepared.complete;round++){prepared=await call({artistPerformance:'prepare'});if(prepared.busy)await new Promise(resolve=>setTimeout(resolve,1000));}
          console.log(JSON.stringify({artistOpeningsComplete:prepared.complete===true}));
          JS
