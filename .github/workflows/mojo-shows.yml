name: Import MOJO shows
on:
  schedule:
    # Nederland is UTC+2 in de zomer en UTC+1 in de winter.
    - cron: '0 10,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: mojo-shows-production
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Daily noon import (or manual first run)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          const hour = new Intl.DateTimeFormat('nl-NL', { timeZone: 'Europe/Amsterdam', hour: '2-digit', hourCycle: 'h23' }).format(new Date());
          if (process.env.EVENT_NAME === 'schedule' && hour !== '12') {
            console.log('Geen Nederlandse middagrun; zomer-/wintertijd wordt gerespecteerd.');
            process.exit(0);
          }
          const failures=new Set();
          // Tijdschema vóór de imports vastleggen; daarna nogmaals voor nieuw ontdekte concerten.
          for (const endpoint of ['https://esmojo.nl/api/timetables-sync','https://esmojo.nl/api/shows-sync','https://esmojo.nl/api/ontrack-concerts-sync','https://esmojo.nl/api/timetables-sync']) {
            try {
              const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
              identityUrl.searchParams.set('audience', endpoint);
              const identity = await fetch(identityUrl, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
              if (!identity.ok) throw new Error('Workflow-identiteit kon niet worden verkregen.');
              const { value } = await identity.json();
              console.log(`::add-mask::${value}`);
              const result = await fetch(endpoint, { method: 'POST', headers: { Authorization: `Bearer ${value}` }, signal: AbortSignal.timeout(310000) });
              const data = await result.json();
              if (!result.ok) { console.log(JSON.stringify({endpoint,status:result.status,code:data.code,stage:data.stage,venue:data.venue,sourceStatus:data.sourceStatus})); throw new Error('Import mislukt.'); }
              if (!data.ok) throw new Error('Import niet bevestigd.');
              failures.delete(endpoint);console.log(JSON.stringify({endpoint,...data}));
            } catch { failures.add(endpoint); console.log('Import niet bevestigd: '+endpoint+'; bestaande inventaris blijft behouden.'); }
          }
          if(failures.size)throw new Error('Een of meer concertinventarissen konden niet worden vernieuwd.');
          JS
