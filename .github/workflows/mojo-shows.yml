name: Import concert catalogue and capture showday timetable
on:
  schedule:
    - cron: '0 3,4 * * *'
    - cron: '0 10,11 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Alleen de agenda lezen en centrale catalogus controleren, niets opslaan
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['.github/workflows/mojo-shows.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: mojo-shows-production
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Import only at five and capture timetable only at noon
        env:
          VERIFY_ONLY: ${{ github.event_name == 'push' || inputs.verify_only == true }}
        run: |
          node --input-type=module <<'JS'
          const hour=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hourCycle:'h23'}).format(new Date()),verify=process.env.VERIFY_ONLY==='true';
          if(!verify&&!['05','12'].includes(hour)){console.log('Geen Nederlandse import- of tijdschemarun.');process.exit(0);}
          const agenda=verify||hour==='05',endpoint='https://esmojo.nl/api/'+(agenda?'shows-sync':'timetables-sync');
          if(agenda){let ready=false;for(let n=0;n<24;n++){try{const r=await fetch(endpoint,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.status===405&&r.headers.get('x-esmojo-agenda-import')==='2'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,10000));}if(!ready)throw Error('AGENDA_DEPLOYMENT_NOT_READY');}
          async function call(body){const identityUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);identityUrl.searchParams.set('audience',endpoint);const identity=await fetch(identityUrl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(310000)});const result=await response.json();if(!response.ok){const code=/^[A-Z_0-9]{1,60}$/.test(result.code||'')?result.code:'CONCERT_IMPORT_UNCONFIRMED',stage=/^[a-z-]{1,30}$/.test(result.stage||'')?result.stage:'unknown';console.log(JSON.stringify({code,stage,...Number.isInteger(result.status)?{status:result.status}:{},.../^[a-z-]{1,40}$/.test(result.venue||'')?{venue:result.venue}:{}}));throw Error('CONCERT_IMPORT_UNCONFIRMED');}return result;}
          let result=await call(verify?{verifyOnly:true}:{});console.log(JSON.stringify(result));
          for(let batch=0;agenda&&!verify&&(result.concertsPending||result.photosPending)&&batch<100;batch++){result=await call({operation:result.concertsPending?'continue':'photos'});console.log(JSON.stringify(result));}
          if(result.concertsPending||result.photosPending)throw Error('CONCERT_IMPORT_INCOMPLETE');
          JS
