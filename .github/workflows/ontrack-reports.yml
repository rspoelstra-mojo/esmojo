name: Process OnTrack reports
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ontrack-reports-production
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Process private Drive queue without copying data to GitHub
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/ontrack-reports-sync';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
          const identity=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if(!identity.ok)throw Error('Workflow-identiteit niet bevestigd.');
          const {value}=await identity.json();console.log(`::add-mask::${value}`);
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${value}`},signal:AbortSignal.timeout(310000)});
          if(!response.ok)throw Error('Rapportverwerking niet bevestigd; geen broninhoud in logs.');
          const result=await response.json();if(result.ok!==true)throw Error('Rapportverwerking niet bevestigd.');
          console.log(JSON.stringify({ok:result.ok,blocked:result.blocked}));
          JS
