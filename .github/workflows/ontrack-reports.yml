name: Send show report emails
# Elke 15 minuten: verstuurt de showrapportagemail voor nieuwe online beschikbare rapportages.
# (Bestandsnaam blijft ontrack-reports.yml omdat de vaste workflow-identiteit daaraan gebonden is.)
# De oude OnTrack-/Drive-verwerking is uitgefaseerd; de CSV-aanlevering loopt via report-intake.yml.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'mail = rapportagemail versturen; inspect = status technische coördinatie lezen; recover = blijvende onzekerheidsfence opheffen (alleen als veilig)'
        type: choice
        default: mail
        options:
          - mail
          - inspect
          - recover
permissions:
  contents: read
  id-token: write
concurrency:
  group: ontrack-reports-production
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Send pending show report emails without copying data to GitHub
        env:
          OPERATION: ${{ github.event.inputs.operation }}
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/ontrack-reports-sync';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
          const identity=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if(!identity.ok)throw Error('Workflow-identiteit niet bevestigd.');
          const {value}=await identity.json();console.log(`::add-mask::${value}`);
          const operation=['inspect','recover'].includes(process.env.OPERATION)?process.env.OPERATION:null;
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${value}`,...operation?{'Content-Type':'application/json'}:{}},body:operation?JSON.stringify({coordinator:operation}):undefined,signal:AbortSignal.timeout(310000)});
          const result=await response.json().catch(()=>({}));
          if(!response.ok||result.ok!==true){console.log(JSON.stringify({code:/^[A-Z][A-Z0-9_]{2,59}$/.test(result.code||'')?result.code:'UNCONFIRMED'}));throw Error('Rapportmail niet bevestigd; geen ontvangers of inhoud in logs.');}
          if(operation){const safe=['state','uncertain','leaseActive','leaseUntil','updatedAt','sequence','cursorVersion','recovered','reason'],out={};for(const key of safe)if(Object.hasOwn(result,key)&&(result[key]===null||['string','number','boolean'].includes(typeof result[key])))out[key]=result[key];console.log(JSON.stringify({operation,...out}));}
          else console.log(JSON.stringify({ok:true,sent:result.sent}));
          JS
