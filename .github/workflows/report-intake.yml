name: Process received CSV reports
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: report-intake
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Process received CSV reports
        run: |
          node --input-type=module <<'JS'
          const target='https://esmojo.nl/api/report-intake-sync';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',target);
          const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');
          const {value}=await identity.json();console.log('::add-mask::'+value);
          const response=await fetch(target,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(290000)});
          const result=await response.json();
          if(!response.ok||result?.ok!==true){console.log(JSON.stringify({code:result.code||'UNCONFIRMED'}));throw Error('REPORT_INTAKE_UNCONFIRMED');}
          console.log(JSON.stringify({processed:result.processed,statuses:result.statuses}));
          JS
