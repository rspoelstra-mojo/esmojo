name: Activate native Reports storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reports-cutover.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: approved-background-tasks-production
  cancel-in-progress: false
jobs:
  cutover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check the published cutover protocol without credentials
        run: |
          node --input-type=module <<'NODE'
          let ready=false;
          for(let round=0;round<18;round++){
            try{const response=await fetch('https://esmojo.nl/api/reports-cutover-sync',{method:'GET',redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(10000)});if(response.status===405&&response.headers.get('x-esmojo-reports-cutover')==='3'){ready=true;break;}}catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!ready)throw Error('REPORTS_CUTOVER_DEPLOYMENT_NOT_READY');
          console.log('Published native Reports cutover protocol confirmed.');
          NODE
      - name: Continue the bounded authorized Reports cutover
        env:
          REPORTS_CUTOVER_RESUME_TECHNICAL: '1'
        run: node tools/background/continue.mjs --reports-cutover
