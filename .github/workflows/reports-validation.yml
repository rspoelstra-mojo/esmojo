name: Validate copied Reports data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reports-validation.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: approved-background-tasks-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Wait for the published diagnostic read-only validation protocol
        run: node tools/background/wait-reports-validation.mjs
      - name: Compare copied Reports without business writes
        run: node tools/background/continue.mjs --reports-validation
