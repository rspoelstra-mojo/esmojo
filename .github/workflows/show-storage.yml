name: Archive active show storage
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Alleen schema en echte Gashouder-bron controleren; geen archivering
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: active-show-storage-production
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Mirror active preparation and archive eligible shows
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/show-storage-sync';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
          const identity=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if(!identity.ok)throw Error('Workflow-identiteit niet bevestigd.');
          const {value}=await identity.json();console.log(`::add-mask::${value}`);
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${value}`,'Content-Type':'application/json'},body:JSON.stringify({checkOnly:process.env.CHECK_ONLY==='true'}),signal:AbortSignal.timeout(310000)});
          const data=await response.json();
          // Alleen technische aantallen; geen showinhoud, namen, IDs of foutenlogs.
          console.log(JSON.stringify({enabled:data.enabled,mirrored:data.mirrored,archived:data.archived,failed:data.failed,schemaReady:data.schemaReady,verifiedShows:data.verifiedShows,driveBridge:data.driveBridge}));
          if(!response.ok||!data.ok)throw Error('Archivering niet bevestigd; brongegevens blijven behouden.');
          JS
