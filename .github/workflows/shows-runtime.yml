name: Verify native Shows runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: approved-background-tasks-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify native reads and technical atomic writes
        run: node tools/background/check-native-shows.mjs
