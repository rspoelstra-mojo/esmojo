name: Check active storage database
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create Supabase roles without secrets
        run: psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
      - name: Apply migration twice and verify permissions and atomic writes
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611060001_active_show_storage.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611060001_active_show_storage.sql
          psql -v ON_ERROR_STOP=1 -f tools/storage/check.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611100001_show_management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611100001_show_management.sql
          psql -v ON_ERROR_STOP=1 -f tools/storage/check-show-management.sql
