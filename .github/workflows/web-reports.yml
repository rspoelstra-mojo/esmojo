name: Index web reports
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: web-reports-production
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Validate private CSVs without PDF generation or email delivery
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/web-reports-sync',url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
          const identity=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});if(!identity.ok)throw Error('Workflow-identiteit niet bevestigd.');
          const {value}=await identity.json();console.log(`::add-mask::${value}`);
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${value}`},signal:AbortSignal.timeout(310000)});if(!response.ok)throw Error('Webinventarisatie niet bevestigd; geen broninhoud in logs.');
          const result=await response.json();if(result.ok!==true)throw Error('Webinventarisatie niet bevestigd.');console.log(JSON.stringify({ok:true}));
          JS
