name: Index web reports
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      historical_only:
        description: Alleen historische rapportages indexeren; geen mails versturen
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: web-reports-production
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Publish web reports and deliver online mail independently of PDF generation
        env:
          HISTORICAL_ONLY: ${{ inputs.historical_only }}
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://esmojo.nl/api/web-reports-sync',url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
          const identity=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});if(!identity.ok)throw Error('Workflow-identiteit niet bevestigd.');
          const {value}=await identity.json();console.log(`::add-mask::${value}`);
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${value}`,'Content-Type':'application/json'},...(process.env.HISTORICAL_ONLY==='true'?{body:JSON.stringify({historicalOnly:true})}:{}),signal:AbortSignal.timeout(310000)});if(!response.ok)throw Error('Webinventarisatie niet bevestigd; geen broninhoud in logs.');
          const result=await response.json();if(result.ok!==true)throw Error('Webinventarisatie niet bevestigd.');console.log(JSON.stringify(process.env.HISTORICAL_ONLY==='true'?{ok:result.ok,registered:result.registered,validated:result.validated,invalid:result.invalid,available:result.available}:{ok:true}));
          JS
