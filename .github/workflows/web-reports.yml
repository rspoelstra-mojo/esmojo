name: Update incident references
on:
  push:
    branches: [main]
    paths:
      - 'server/dataverse-reports/incident-daily.js'
      - 'server/artist-runtime-verification.js'
      - 'server/native-runtime-verification.js'
      - 'server/reports-performance.js'
      - 'server/barrier-references.js'
      - 'server/barrier-display.js'
      - 'server/dataverse-reports/opening.js'
      - 'api/web-reports-sync.js'
      - '.github/workflows/web-reports.yml'
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 22,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.event_name == 'push' && 'reports-native-publication-check' || github.event.schedule == '*/5 * * * *' && 'reports-existing-mail' || 'incident-reference-rebuild' }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Update stored daily incident references without CSV ingestion
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'JS'
          const hour=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hourCycle:'h23'}).format(new Date());
          const daily=['workflow_dispatch','push'].includes(process.env.GITHUB_EVENT_NAME)||process.env.GITHUB_EVENT_SCHEDULE==='0 22,23 * * *';
          if(process.env.GITHUB_EVENT_NAME==='schedule'&&daily&&hour!=='00')process.exit(0);
          const endpoint='https://esmojo.nl/api/'+(daily?'incident-references-sync':'web-reports-sync');
          async function call(body){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
            const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(310000)});const result=await response.json();if(!response.ok||result?.ok!==true){console.log(JSON.stringify({code:result.code||'UNCONFIRMED',stage:result.stage||null}));throw Error('REPORT_WORKER_UNCONFIRMED');}return result;
          }
          if(daily){
            if(process.env.GITHUB_EVENT_NAME==='push'){let ready=false;for(let attempt=0;attempt<30;attempt++){try{const response=await fetch(endpoint,{signal:AbortSignal.timeout(10000)});if(response.headers.get('x-esmojo-artist-runtime')==='7'){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,10000));}if(!ready)throw Error('ARTIST_DEPLOYMENT_NOT_READY');}
            let ready=false;for(let attempt=0;attempt<12;attempt++){try{if((await call({incidentRefresh:true,checkOnly:true})).workerVersion===3){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,20000));}if(!ready)throw Error('INCIDENT_WORKER_NOT_READY');
            let complete=false;for(let round=0;round<600;round++){const result=await call({incidentRefresh:true});if(result.workerVersion!==3||typeof result.pending!=='boolean'||!['processing','complete','no_eligible_reports'].includes(result.status))throw Error('INCIDENT_WORKER_UNCONFIRMED');if(!result.pending){if(result.status!=='complete')throw Error('INCIDENT_REFERENCES_NO_ELIGIBLE_REPORTS');complete=true;break;}}if(!complete)throw Error('INCIDENT_REFERENCES_INCOMPLETE');console.log('Incidentreferenties bijgewerkt.');if(process.env.GITHUB_EVENT_NAME==='push'){console.log(JSON.stringify(await call({artistVerify:true})));for(const runtimeVerify of ['authority','accounts','shows','reports','files','production-prepare','production']){const result=await call({runtimeVerify});console.log(JSON.stringify(result));if(runtimeVerify==='production'&&result.imageWithinBudget!==true)throw Error('BARRIER_DISPLAY_BUDGET_EXCEEDED');}console.log(JSON.stringify(await call({reportPerformance:'baseline'})));let preparation=await call({reportPerformance:'inventory'});for(let round=0;round<600&&!preparation.complete;round++){preparation=await call({reportPerformance:'prepare'});console.log(JSON.stringify(preparation));if(preparation.busy)await new Promise(resolve=>setTimeout(resolve,1000));}if(!preparation.complete)throw Error('REPORT_OPENING_INCOMPLETE');const measured=await call({reportPerformance:'measure'});console.log(JSON.stringify(measured));if(!measured.backendWithinBudget)throw Error('REPORT_BACKEND_BUDGET_EXCEEDED');}
          }else{await call({deliverExisting:true});console.log('Bestaande mailwachtrij verwerkt.');}
          JS
