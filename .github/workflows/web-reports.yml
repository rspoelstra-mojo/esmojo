name: Update incident references
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 22,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.event.schedule == '*/5 * * * *' && 'reports-existing-mail' || 'incident-reference-rebuild' }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Update stored daily incident references without CSV ingestion
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'JS'
          const hour=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hourCycle:'h23'}).format(new Date());
          const daily=process.env.GITHUB_EVENT_NAME==='workflow_dispatch'||process.env.GITHUB_EVENT_SCHEDULE==='0 22,23 * * *';
          if(process.env.GITHUB_EVENT_NAME==='schedule'&&daily&&hour!=='00')process.exit(0);
          const endpoint='https://esmojo.nl/api/'+(daily?'incident-references-sync':'web-reports-sync');
          for(let round=0;round<300;round++){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);url.searchParams.set('audience',endpoint);
            const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});if(!identity.ok)throw Error('OIDC_UNAVAILABLE');const {value}=await identity.json();console.log('::add-mask::'+value);
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},body:JSON.stringify(daily?{incidentRefresh:true}:{deliverExisting:true}),signal:AbortSignal.timeout(310000)});if(!response.ok)throw Error('INCIDENT_REFERENCES_UNCONFIRMED');const result=await response.json();if(!result.pending){console.log('Incidentreferenties bijgewerkt.');break;}if(round===299)throw Error('INCIDENT_REFERENCES_INCOMPLETE');await new Promise(resolve=>setTimeout(resolve,1000));
          }
          JS
