<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ESMOJO</title>
    <link rel="preload" as="image" href="/src/assets/login-background.webp" type="image/webp" fetchpriority="high" />
    <link rel="icon" href="/icons/favicon-blauw.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-blauw.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/favicon-blauw-180.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('esmojo-theme') || 'light'; } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <section id="auth-panel" class="auth-panel" aria-label="Inloggen"><p>Inloggen laden…</p></section>
    <a class="skip-link" href="#content">Naar de inhoud</a>
    <aside class="rail" aria-label="Hoofdmenu" hidden>
      <a class="brand" href="#/" aria-label="ESMOJO homepage"></a>
      <nav aria-label="Hoofdnavigatie" id="navigation"></nav>
      <div class="rail-bottom">
        <button class="rail-item" id="theme-toggle" type="button" aria-label="Donkere modus inschakelen" aria-pressed="false">
          <span id="theme-icon"></span><span class="tooltip" role="tooltip" id="theme-label">Donkere modus</span>
        </button>
        <a class="rail-item" href="#/beheerder" aria-label="Beheerder" data-page="beheerder">
          <span id="admin-icon"></span><span class="tooltip" role="tooltip">Beheerder</span>
        </a>
        <a class="rail-item profile" href="#/account" aria-label="Accountinstellingen" data-page="account">
          <span class="avatar"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="12" r="5" fill="currentColor"/><path d="M6 29v-3a10 10 0 0 1 20 0v3" fill="currentColor"/></svg></span>
          <span class="tooltip" role="tooltip">Accountinstellingen</span>
        </a>
      </div>
    </aside>
    <div class="workspace" hidden>
      <aside class="submenu" aria-label="Submenu" hidden>
        <div class="submenu-heading">
          <h2 id="submenu-title"></h2>
          <div class="submenu-search" role="search" aria-label="Submenu filteren">
            <input id="submenu-search-input" type="search" aria-label="Zoek in submenu" autocomplete="off" spellcheck="false" disabled tabindex="-1" />
          </div>
          <button id="submenu-search-toggle" class="submenu-search-toggle" type="button" aria-label="Zoeken in submenu" aria-expanded="false" aria-controls="submenu-search-input" hidden></button>
        </div>
        <nav id="submenu-navigation" aria-labelledby="submenu-title"></nav>
        <p id="submenu-search-empty" class="submenu-search-empty" hidden>Geen resultaten</p>
        <span id="submenu-search-status" class="visually-hidden" role="status"></span>
      </aside>
      <main id="content" tabindex="-1"><div class="content-box"></div></main>
    </div>
  </body>
</html>
